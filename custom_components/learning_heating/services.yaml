feedback:
  name: Comfort feedback
  description: >-
    Say a room was too hot or too cold, now or at a time in the last two days.
    Too cold while the room was still short of its target makes it start heating
    earlier; otherwise the target for that part of the day moves by 0.5°C.
  fields:
    room:
      name: Room
      description: Room key from learning_heating.yaml, e.g. lounge or spare_bedroom.
      required: true
      example: kitchen
      selector:
        text:
    feeling:
      name: Feeling
      required: true
      selector:
        select:
          options:
            - too_hot
            - too_cold
    when:
      name: When
      description: Leave empty for now.
      selector:
        datetime:
    nudge:
      name: Change now by
      description: >-
        Also warm (too cold) or cool (too hot) the room by this much straight away,
        until its next schedule change. 0 only learns.
      default: 0
      selector:
        number:
          min: 0
          max: 3
          step: 0.5
          unit_of_measurement: "°C"

night_feedback:
  name: How last night was
  description: >-
    Say how last night was in a bedroom. Too warm after heating that came on while
    people were asleep makes it come on later; otherwise the night temperature moves
    by 0.5°C. Too cold with the room still short in the morning makes it warm up earlier.
  fields:
    room:
      name: Room
      required: true
      example: spare_bedroom
      selector:
        text:
    feeling:
      name: Last night was
      required: true
      selector:
        select:
          options:
            - too_cold
            - fine
            - too_hot
    person:
      name: Person
      description: Who slept there, if not whoever is calling.
      selector:
        entity:
          domain: person

resume:
  name: Resume schedule
  description: >-
    End a manual change to a room (or a valve switched off by hand) and go back to
    the room's plan straight away.
  fields:
    room:
      name: Room
      required: true
      example: lounge
      selector:
        text:

reset_feedback:
  name: Reset comfort feedback
  description: Forget everything a room has learnt from feedback.
  fields:
    room:
      name: Room
      required: true
      example: kitchen
      selector:
        text:
